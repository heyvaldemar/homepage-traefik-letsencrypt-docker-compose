---
# https://gethomepage.dev/widgets/
#
# The header row. `resources` reads the host through /proc, which is why it
# needs no Docker access at all.

- logo:
    icon: homepage.png

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
      hour12: false

- resources:
    cpu: true
    memory: true
    disk: /
