# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259}}
  homepage: &homepage-image ${HOMEPAGE_IMAGE_TAG:-ghcr.io/gethomepage/homepage:${HOMEPAGE_IMAGE_VERSION:-v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61}}
  dockerproxy: &dockerproxy-image ${HOMEPAGE_DOCKERPROXY_IMAGE_TAG:-ghcr.io/tecnativa/docker-socket-proxy:${HOMEPAGE_DOCKERPROXY_IMAGE_VERSION:-v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}}
  backups: &backups-image ${HOMEPAGE_BACKUPS_IMAGE_TAG:-alpine:${HOMEPAGE_BACKUPS_IMAGE_VERSION:-3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}}

networks:
  homepage-network:
    external: true
  traefik-network:
    external: true

volumes:
  homepage-config-backups:
  traefik-certificates:

services:
  # The ONLY container here that touches the Docker socket.
  #
  # This is not a preference, it is the thing that makes the arrangement work
  # at all. Give Homepage the socket directly AND keep
  # `no-new-privileges: true`, and it fails with `connect EACCES`: the
  # hardening blocks the supplementary-group access it would need to open the
  # socket file. The usual fix found in forums is to drop the hardening. The
  # better one is not to hand a dashboard the raw Docker API.
  #
  # With POST denied, a compromised Homepage can list containers and read their
  # status, and cannot start, stop, delete or exec anything at all.
  dockerproxy:
    image: *dockerproxy-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults; the override survives every
    # git pull.
    deploy:
      resources:
        limits:
          memory: ${HOMEPAGE_DOCKERPROXY_MEMORY_LIMIT:-64m}
          cpus: "${HOMEPAGE_DOCKERPROXY_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${HOMEPAGE_DOCKERPROXY_MEMORY_RESERVATION:-16m}
          cpus: "${HOMEPAGE_DOCKERPROXY_CPU_RESERVATION:-0.1}"
    environment:
      # Everything Homepage needs to show container status and stats, and
      # nothing else. Each of these is an allow-list entry; the image denies
      # anything not named here.
      CONTAINERS: 1
      # POST=0 is what makes this read-only. There is no override file that
      # turns it on: a dashboard has no business writing to the Docker API.
      POST: 0
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Pinned to their defaults rather than left unstated, so the posture is
      # auditable by reading this file instead of the image's documentation.
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      EXEC: 0
      SECRETS: 0
      SYSTEM: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      SWARM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-network
    restart: unless-stopped

  # Seeds your configuration directory the first time, and never touches it
  # again.
  #
  # Homepage is configured by hand-written YAML, which means the config
  # directory belongs to you and not to this repository. If it were tracked in
  # git, every `git pull` would collide with your edits and `update.sh` - which
  # refuses to run over local changes - would refuse to run at all.
  #
  # So the starting point ships as config.example/, this copies it into an
  # empty config directory once, and the directory itself is gitignored. New
  # options arrive in config.example/ where you can read them and copy what you
  # want; nothing is ever overwritten.
  init-config:
    image: *backups-image
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Three, and each one is needed for a reason worth stating. The config
      # directory belongs to you, not to this container: it may be owned by
      # any uid and this runs as root, so DAC_OVERRIDE is what lets it write
      # there at all. CHOWN and FOWNER are what let it hand the files it just
      # wrote to that same owner - because files you cannot edit without sudo,
      # in a directory you were told is yours, are not much use.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          memory: ${HOMEPAGE_INIT_MEMORY_LIMIT:-64m}
          cpus: "${HOMEPAGE_INIT_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${HOMEPAGE_INIT_MEMORY_RESERVATION:-8m}
          cpus: "${HOMEPAGE_INIT_CPU_RESERVATION:-0.1}"
    command: >-
      sh -c 'set -e;
      if [ -n "$$(ls -A /config 2>/dev/null)" ]; then
        echo "the config directory already has files; leaving every one of them alone";
      else
        OWNER="$$(stat -c %u /config)"; GROUP="$$(stat -c %g /config)";
        echo "seeding the config directory from config.example, as $$OWNER:$$GROUP";
        cp -r /seed/. /config/;
        chown -R "$$OWNER:$$GROUP" /config;
        ls -1 /config | sed "s/^/  /";
      fi'
    volumes:
      - ./config.example:/seed:ro
      - ${HOMEPAGE_CONFIG_PATH:-./config}:/config
    networks:
      - homepage-network
    restart: "no"

  homepage:
    image: *homepage-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # A Next.js server reading YAML and making outbound HTTP requests. One
    # capability, and it is not for the network.
    #
    # Homepage writes a logs directory inside its config directory on every
    # start. That directory is yours - it belongs to whichever uid owns it on
    # your host - and this container runs as root, which without DAC_OVERRIDE
    # cannot create anything inside a directory it does not own. The symptom is
    # a server that starts, passes its own health check, and answers 500 to
    # every page: `EACCES: permission denied, mkdir '/app/config/logs'`.
    #
    # DAC_OVERRIDE is the narrow answer. The alternative - chowning your config
    # directory to a uid this file picked - takes a directory the README calls
    # yours and hands it to somebody else.
    #
    # Note what is still absent: the Docker socket. With a direct socket mount,
    # no-new-privileges is exactly what breaks this container.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    stop_grace_period: ${HOMEPAGE_STOP_GRACE_PERIOD:-30s}
    # Resource limits as .env-overridable defaults; the override survives every
    # git pull.
    deploy:
      resources:
        limits:
          memory: ${HOMEPAGE_MEMORY_LIMIT:-512m}
          cpus: "${HOMEPAGE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${HOMEPAGE_MEMORY_RESERVATION:-64m}
          cpus: "${HOMEPAGE_CPU_RESERVATION:-0.1}"
    volumes:
      # Your configuration. Yours to edit; seeded once by init-config and
      # gitignored, so `git pull` never collides with it.
      - ${HOMEPAGE_CONFIG_PATH:-./config}:/app/config
    environment:
      TZ: ${HOMEPAGE_TZ:-Etc/UTC}
      # REQUIRED since v1.0, and the single most common reason a fresh
      # Homepage answers "host validation failed" instead of rendering.
      #
      # It is compared against the Host HEADER, which carries the port whenever
      # the port is not the scheme's default. On 443 that means the hostname
      # alone is right, which is what this defaults to. Behind anything serving
      # on another port - a second proxy, a tunnel, a local test on :8443 - the
      # header says `host:port` and the hostname alone no longer matches, so
      # set HOMEPAGE_ALLOWED_HOSTS explicitly and include it.
      #
      # Worth knowing how this fails: the container stays HEALTHY throughout,
      # because its own probe talks to 127.0.0.1:3000 and never sends the
      # header. Everything looks fine and every real request gets a 400.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-${HOMEPAGE_HOSTNAME:?set in .env - see .env.example}}
    networks:
      - homepage-network
      - traefik-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.homepage.rule=Host(`${HOMEPAGE_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.homepage.service=homepage"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.homepage.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      # Enable TLS on this router
      - "traefik.http.routers.homepage.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.homepage.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.homepage.loadbalancer.passhostheader=true"
      # A dashboard is html, css, javascript and json all the way down.
      - "traefik.http.middlewares.homepage-compress.compress=true"
      - "traefik.http.routers.homepage.middlewares=homepage-compress"
      # THERE IS DELIBERATELY NO BUFFERING MIDDLEWARE HERE. Traefik streams
      # request and response bodies unless you attach one; attaching it is what
      # turns buffering ON, and setting its limits to 0 means "no size ceiling",
      # not "off". Measured against a response that takes four seconds to
      # produce: 0.03s to the first byte without it, 4.15s with it.
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      init-config:
        condition: service_completed_successfully
      dockerproxy:
        condition: service_started
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Homepage's widgets fan out to whatever you point them at, and a slow
      # backend behind one of them should not become a failed dashboard.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=${HOMEPAGE_READ_TIMEOUT:-0s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=${HOMEPAGE_WRITE_TIMEOUT:-0s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=${HOMEPAGE_IDLE_TIMEOUT:-600s}"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    # A plain alpine: the config directory is hand-written YAML, so the loop
    # needs tar and nothing else.
    image: *backups-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this container needs to
    # write archives it owns.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults; the override survives every
    # git pull.
    deploy:
      resources:
        limits:
          memory: ${HOMEPAGE_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${HOMEPAGE_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${HOMEPAGE_BACKUPS_MEMORY_RESERVATION:-16m}
          cpus: "${HOMEPAGE_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      sh -c 'sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting config backup to $$DATA_FILE";
        tar -zcpf "$$DATA_FILE.partial" $$DATA_PATH; RC=$$?;
        if { [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; } && tar -tzf "$$DATA_FILE.partial" > /dev/null 2>&1; then
          mv "$$DATA_FILE.partial" "$$DATA_FILE";
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - ${HOMEPAGE_CONFIG_PATH:-./config}:${DATA_PATH:-/config}
      - homepage-config-backups:${DATA_BACKUPS_PATH:-/srv/homepage-config/backups}
    environment:
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/homepage-config/backups}
      DATA_PATH: ${DATA_PATH:-/config}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-homepage-config-backup}
    networks:
      - homepage-network
    restart: unless-stopped
